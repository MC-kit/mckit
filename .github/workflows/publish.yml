name: Build and publish on PyPI

on:
  release:
    types:
      - published

  workflow_dispatch:  # TODO: debug only


permissions:
  contents: read  # Minimal required permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-20.04 is required to build wheels for older OS (clusters...)
        os: [ubuntu-20.04, ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: 'true'
          
      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: 📦 Build package
        env:
          MCKIT_SRC: ${{github.workspace}}
        run: |
          uv build --wheel

      - name: 📤 Publish package on PyPI
        if: ${{ !github.event.act }} # skip during local actions testing
        run: uv publish --username=__token__ --password=${{ secrets.PYPI_TOKEN }}
