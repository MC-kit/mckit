name: Tests

on:
  workflow_dispatch:

  push:
    branches:
      - "master"
      - "devel"
      - "main"
      - "feat/*"
      - "pixi-2"
    paths:
      - "**.py"
      - "**.c"
      - "**.h"
      - "**.yaml"
      - "**.yml"
      - "**.toml"
      - "**/data/**"
      - ".github/constraints.txt"
      - "!adhoc/**"
      - "!tools/**"
  pull_request:
    branches:
      - "master"
      - "devel"
      - "main"
    paths:
      - "**.py"
      - "**.c"
      - "**.h"
      - "**.yaml"
      - "**.yml"
      - "**.toml"
      - "!adhoc/**"
      - "!tools/**"

# permissions:
#   contents: read  # Minimal required permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.13"
  UV_LINK_MODE: "copy"

jobs:

  lint:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip_ci]')
    steps:
      - name: ✅ Check out the repository
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.71.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'devel' }}
#          auth-host: prefix.dev
#          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      
      - name: Run pre commit checks
        run: |
          pixi run pre-commit

  
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: 'true'

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.71.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'devel' }}
#          auth-host: prefix.dev
#          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}
#          cache-dependency-glob: |
#            **/uv.lock
#            **/pyproject.toml

      - name: 🐍 Install the project
        run: |
          pixi install

      - name: 📦 Build documentation
        run: |
          uv run sphinx-build docs/source docs/build

  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        include: 
          - os: windows-latest
            python-version: '3.13'  # Windows runner is too slow

    steps:

      - name: ✅ Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml      

      - name: 🐍 Install the project
        run: uv sync --all-extras --no-dev --group test

      - name: ✅ Run tests
        run: |
          uv run --group test pytest --cov --cov-report term-missing:skip-covered --cov-report xml

      - name: 📤 Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
