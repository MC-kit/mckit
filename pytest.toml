[pytest]
minversion = "9.0"
cache_dir = ".cache/pytest"
strict = true
norecursedirs = [
    "*.egg-info",
    ".*",
    "build",
    "data",
    "dist",
    "docs/_build",
    "docs/examples",
    "htmlcov",
    "notebooks",
    "tools",
    "wrk",
]
python_functions = [ "profile_*", "test_*" ]
addopts = [
    "--benchmark-autosave",
    "--benchmark-disable",
    "--benchmark-group-by=name,fullname",
    "--benchmark-storage=.cache/benchmarks",
    "--failed-first",
    "--ignore=setup.py",
    "--numprocesses=logical",
    "--quiet",
    "--strict-markers",
    "--tb=short",
    "--xdoctest",
    "-ra",                                   # extra test summary: all except passed
]
doctest_optionflags = [
    "ALLOW_BYTES",
    "ALLOW_UNICODE",
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
    "NORMALIZE_WHITESPACE",
    "NUMBER",
]
testpaths = [ "docs", "src", "tests" ]
markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
filterwarnings = [
    "error",
    "ignore:.*not typechecking multipledispatch.dispatcher.*UserWarning",
    'ignore:.*Implicit None on return values:DeprecationWarning',
    'ignore:.*io.FileIO \[closed\]',
    "ignore:.*GIL.*enabled to load module.*mckit.geometry.*:RuntimeWarning"
]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
