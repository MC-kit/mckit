[build-system]
build-backend = "scikit_build_core.build"
requires = [ "numpy", "scikit-build-core>=0.10" ]

[project]
name = "mckit"
version = "0.8.6"
description = "Tools to process MCNP models and results"
readme = "README.rst"
keywords = [ "mckit", "MCNP" ]
license = "MIT"
maintainers = [ { name = "dvp2015", email = "dmitri_portnov@yahoo.com" } ]
authors = [ { name = "rrn" } ]
requires-python = ">=3.12"  # connectorx==0.4.3 prevents <4
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "attrs>=25.4",
  "click>=8.3.1",
  "loguru>=0.7.3",
  "mkl-devel>=2025.3.1",
  "numpy",
  "ply>=3.11",
  "sly>=0.5",
  "tomli-w>=1.2",
  "tqdm>=4.67.3",
  "typer>=0.24",
]
urls.Documentation = "https://mckit.readthedocs.io"
urls.Homepage = "https://github.com/MC-kit/mckit"
urls.Issues = "https://github.com/MC-kit/mckit/issues"
urls.Repository = "https://github.com/MC-kit/mckit"
scripts.mckit = "mckit.cli.runner:mckit"

[dependency-groups]
dev = [ { include-group = "style" }, { include-group = "test" } ]
test = [
  "pytest>=9",
  "pytest-benchmark>=5.1",
  "pytest-cov>=7.1.0",
  "pytest-durations>=1.5",
  "pytest-emoji>=0.2",
  "pytest-mock>=3.14",
  "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.2",
]
docs = [
  "esbonio>=0.16.5",
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.2",
  "sphinx-togglebutton>=0.3.2",
]
analyze = [ "jupyterlab>=4.2.5", "jupytext>=1.16.4" ]
coverage = [ "coverage[toml]>=7.9.2" ]
lint = [ "pylint", "pylint-per-file-ignores" ]
mypy = [
  "mypy>=1.2",
  "pep8-naming>=0.12.1",
  "types-setuptools>=80.9.0.20250529",
]
pre_commit = [ "pre-commit>=4.3" ]
pypi = [ "mkl-devel", "numpy", "repairwheel", "scikit-build-core" ]
pyright = [ "pyright>=1.1.406" ]
ruff = [ "ruff>=0.0.259" ]
style = [
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pyright" },
  { include-group = "ruff" },
]
# environments not in dev
typeguard = [ "typeguard>=4.1.5" ]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
build.verbose = false
logging.level = "INFO"
cmake.build-type = "Debug"

[tool.coverage]
run.branch = true
run.omit = [ "**/__init__.py", "*_tab.py", "tools/*.py" ]
run.parallel = true
run.source = [ "src" ]
# [tool.cibuildwheel]
# build-frontend = "build[uv]"
paths.source = [ "src" ]
# Regexes for lines to exclude from consideration
report.exclude_lines = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self.debug",
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
report.fail_under = 90  # TODO dvp: increase limit to 100 with code maturing
report.ignore_errors = true
report.omit = [ "**/__init__.py", "*_tab.py" ]
report.show_missing = true
report.skip_covered = true
report.sort = "Cover"

# MyPy config
# See https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
#     https://dev.to/tusharsadhwani/the-comprehensive-guide-to-mypy-561m

[tool.mypy]
python_version = "3.13"
cache_dir = ".cache/mypy"
files = "src/**/*.py"
# strict = true     # TODO dvp: uncomment this to get strict control
follow_imports = "silent"
# namespace_packages = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
disable_error_code = [ "annotation-unchecked" ]
show_error_context = true
error_summary = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = """  (?x)(
  parser.py$  # mypy doesn't like parser code
| _tab.py$    # ...
| lexer.py$   # ...
  )
"""
pretty = true

[[tool.mypy.overrides]]
module = [
  "IPython.core.magic",
  "IPython.core.magic_arguments",
  "click",
  "click.testing",
  "cyclopts",
  "dask.*",
  "duckdb",
  "eliot",
  "eliot.*",
  "loguru",
  "mckit.*",                      # TODO (dvp, style): make everything typed including extension 'geometry',
  "msgspec",
  "multipledispatch",
  "nox",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pytest",
  "rich.*",
  "scipy.constants",
  "scipy.sparse",
  "tomli",
  "tomllib",
  "xdoctest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tomllib" ]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.xdoctest]
quiet = true
options = ""

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
paths = [ "src", "adhoc" ]
venvs = [ ".pixi/envs/default", ".pixi/envs/analyze", ".pixi/envs/docs" ]
deps-file = "pyproject.toml"
sections = [ "project.dependencies" ]
exclude-deps = [
  "intel-cmplr-lib-ur",
  "mkl-devel",
  "python-dotenv",
  "tomli",
  "tqdm",
  "typer",
]

[tool.rstcheck]
report_level = "ERROR"
ignore_messages = '(Unknown directive type "(todo.*|automodule)".$)'

[tool.pixi]
dependencies.nlopt = ">=2.10.0,<3"
dependencies.mkl-devel = ">=2025.3.0,<2026"
dependencies.numpy = ">=2.4.2,<3"
environments.default = { features = [ "dev", "py313" ], solve-group = "default" }
environments.analyze = { features = [ "analyze", "py313" ], solve-group = "default" }
environments.docs = { features = [ "docs", "py313" ], solve-group = "default" }
environments.typeguard = { features = [ "typeguard", "py313" ], solve-group = "default" }
environments.pypi = { features = [ "pypi", "py313" ], solve-group = "default" }
environments.py312 = { features = [ "test", "py312" ] }
environments.py313 = { features = [ "test", "py313" ], solve-group = "default" }
feature.dev.dependencies.cmake = ">=4.2.3,<5"
feature.dev.target.linux-64.dependencies.gdb = ">=17.1,<18"
feature.py312.dependencies.python = "3.12.*"
feature.py313.dependencies.python = "3.13.*"
feature.pypi.tasks.pypi_build = "uv build --no-build-isolation"
feature.pypi.tasks.repairwheel = "repairwheel -l .pixi/envs/default/lib -o fixed-wheels dist/*.whl"
feature.typeguard.tasks.typeguard = "pytest -vv --emoji --typeguard-packages=src"
# There can be multiple packages in a workspace
# In `package` you specify properties specific to the package
package.name = "mckit"
package.version = "0.8.6"
# Here the build system of the package is specified
# We are using `pixi-build-python` in order to build a Python package
package.build.backend.name = "pixi-build-python"
package.build.backend.version = "*"
package.build.backend.channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
# hatchling = "*"
package.host-dependencies.scikit-build-core = "*"
package.host-dependencies.numpy = "*"
package.host-dependencies.mkl-devel = "*"
package.host-dependencies.nlopt = "*"
package.run-dependencies.numpy = "*"
package.run-dependencies.mkl-devel = "*"
package.run-dependencies.nlopt = "*"
pypi-dependencies.mckit = { path = ".", editable = true }
tasks.fast-test = "pytest -m 'not slow'"
tasks.test = "pytest"
tasks.mypy = "mypy src"
tasks.pre-commit = "pre-commit run --show-diff-on-failure --color=always --all-files"
tasks.ruff = """
  ruff check --fix src tests
  ruff format src tests
"""
tasks.pylint = "pylint --recursive=y src tests"
tasks.pyright = "pyright src tests"
workspace.preview = [ "pixi-build" ]
workspace.channels = [ "conda-forge" ]
# platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
workspace.platforms = [ "linux-64", "win-64" ]

