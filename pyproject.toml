[build-system]
requires = ["scikit-build-core>=0.10", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "mckit"
version = "0.8.6"
requires-python = ">=3.12"                                               # connectorx==0.4.3 prevents <4
description = "Tools to process MCNP models and results"
authors = [{ name = "rrn" }]
readme = "README.rst"
license = "MIT"
keywords = ["mckit", "MCNP"]
maintainers = [{ name = "dvp2015", email = "dmitri_portnov@yahoo.com" }]
# Select from PyPI trove classifiers: https://pypi.org/classifiers/
# poetry (2.0.0) doesn't pass dynamic classifieres to build.py, so, we use static
# about dynamic classifiers in poetry: https://python-poetry.org/docs/pyproject/#classifiers-1
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "attrs>=25.4.0,<26",
    "click>=8.3.0,<9",
    "loguru>=0.7.3,<0.8",
    # "intel-cmplr-lib-ur == 2025.2.0",
    "mkl-devel>=2025.2.0,<2026",
    "numpy",
    "ply>=3.11,<4",
    "python-dotenv>=1.1.1,<2",
    # "scipy (>=1.16.0)",
    "sly>=0.5,<0.6",
    "tomli-w>=1.2.0,<2",
    "tqdm>=4.67.1,<5",
    "typer>=0.19.2,<0.20",
    "scikit-build-core>=0.11.6,<0.12",
    "repairwheel>=0.3.2,<0.4",
    "pre-commit",
    "pydocstringformatter",
    "ruff",
    "mypy",
    "pep8-naming",
    "types-setuptools",
    "pylint",
    "pylint-per-file-ignores",
    "pytest>=8.4.2,<9",
    "pytest-cov>=7.0.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-durations>=1.6.1,<2",
    "pytest-emoji>=0.2.0,<0.3",
    "pytest-benchmark>=5.1.0,<6",
    "pytest-xdist[psutil]>=3.8.0,<4",
    "xdoctest>=1.3.0,<2",
    "coverage[toml]>=7.11.0,<8",
    "typeguard>=4.4.4,<5",
    "rstcheck>=6.2.5,<7",
    "sphinx>=8.2.3,<9",
    "sphinx-autodoc-typehints>=3.5.2,<4",
    "sphinx-click>=6.1.0,<7",
    "sphinx-autobuild>=2025.8.25,<2026",
    "jupyterlab>=4.4.9,<5",
    "jupytext>=1.17.3,<2",                # TODO @dvp: switch to cyclopts, same for click
]

[project.urls]
Homepage = "https://github.com/MC-kit/mckit"
Repository = "https://github.com/MC-kit/mckit"
Documentation = "https://mckit.readthedocs.io"
Issues = "https://github.com/MC-kit/mckit/issues"

[project.scripts]
mckit = "mckit.cli.runner:mckit"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
build.verbose = false
logging.level = "INFO"
cmake.build-type = "Debug"


#[tool.cibuildwheel]
#build-frontend = "build[uv]"


[dependency-groups]
dev = [{ include-group = "style" }, { include-group = "test" }]
style = [
    { include-group = "pre_commit" },
    { include-group = "ruff" },
    { include-group = "mypy" },
    { include-group = "lint" },
    { include-group = "pyright" },
]
pre_commit = ["pre-commit>=2.15.0", "pydocstringformatter>=0.7.3"]
ruff = ["ruff>=0.0.259"]
mypy = [
    "mypy>=1.2.0",
    "pep8-naming>=0.12.1",
    "types-setuptools>=80.9.0.20250529",
]
lint = ["pylint", "pylint-per-file-ignores"]
pyright = ["pyright>=1.1.406"]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-durations>=1.5.2",
    "pytest-emoji>=0.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist[psutil]>=3.8.0",
    "xdoctest>=1.2.0",
    { include-group = "coverage" }, # coverage may be used on its own, see GHA test
]
coverage = ["coverage[toml]>=7.9.2"]
# environments not in dev
typeguard = ["typeguard>=4.1.5"]
docs = [
    "rstcheck[toml,sphinx]>=6.2.5",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinx-autobuild>=2025.8.25",
    "esbonio>=0.16.5",
    "sphinx-togglebutton>=0.3.2",
]
analyze = ["jupyterlab>=4.2.5", "jupytext>=1.16.4"]
pypi = ["scikit-build-core", "numpy", "mkl-devel", "repairwheel"]

[tool.pytest.ini_options]
minversion = "8.4"
cache_dir = '.cache/pytest'
norecursedirs = '''
*.egg-info
.*
build
data
dist
docs/_build
docs/examples
htmlcov
notebooks
tools
wrk
'''
python_functions = "test_*  profile_*"
addopts = '''
-n auto
-ra
-q
--tb=short
--doctest-modules
--strict-markers
--ignore setup.py
--failed-first
--xdoctest
--pytest-durations-min=1
--pytest-resultlog="pytest-result.log"
--benchmark-disable
--benchmark-storage=.cache/benchmarks
--benchmark-autosave
--benchmark-group-by=name,fullname
'''
doctest_optionflags = "ELLIPSIS NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE ALLOW_BYTES NUMBER"
testpaths = ["tests", "src"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
# xfail tests that pass should fail the test suite
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:.*not typechecking multipledispatch.dispatcher.*UserWarning",
    'ignore:.*io.FileIO \[closed\]',
    'ignore:.*Implicit None on return values:DeprecationWarning',
]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.xdoctest]
quiet = true
options = ""

[tool.coverage.paths]
source = ["src", ".nox/*/site-packages"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*_tab.py", "**/__init__.py", "tools/*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90                       # TODO dvp: increase limit to 100 with code maturing
omit = ["*_tab.py", "**/__init__.py"]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
ignore_errors = true
sort = "Cover"


# MyPy config
# See https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
#     https://dev.to/tusharsadhwani/the-comprehensive-guide-to-mypy-561m
[tool.mypy]
python_version = "3.13"
cache_dir = ".cache/mypy"
# strict = true     # TODO dvp: uncomment this to get strict control
follow_imports = "silent"
# namespace_packages = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
disable_error_code = ["annotation-unchecked"]
show_error_context = true
error_summary = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
files = "src/**/*.py"
exclude = '''
  (?x)(
  parser\.py$  # mypy doesn't parser code
| _tab\.py$    # ...
| lexer\.py$   # ...
  )
'''

[[tool.mypy.overrides]]
module = [
    "IPython.core.magic",
    "IPython.core.magic_arguments",
    "click",
    "click.testing",
    "cyclopts",
    "dask.*",
    "duckdb",
    "eliot",
    "eliot.*",
    "loguru",
    "mckit.*",                      # TODO (dvp, style): make everything typed including extension 'geometry',
    "msgspec",
    "multipledispatch",
    "nox",
    "numpy",
    "numpy.testing",
    "pandas",
    "polars",
    "pytest",
    "rich.*",
    "scipy.constants",
    "scipy.sparse",
    "tomli",
    "tomllib",
    "xdoctest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomllib"]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
paths = ["src", "adhoc"]
venvs = [".pixi/envs/default", ".pixi/envs/analyze", ".pixi/envs/docs"]
deps-file = "pyproject.toml"
sections = ["project.dependencies", "dependency-groups"]
exclude-deps = [
    "intel-cmplr-lib-ur",
    "mkl-devel",
    "python-dotenv",
    "scipy",
    "tomli",
    "tqdm",
    "typer",
]

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
# platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
platforms = ["linux-64", "win-64"]

# There can be multiple packages in a workspace
# In `package` you specify properties specific to the package
[tool.pixi.package]
name = "mckit"
version = "0.8.6"

# Here the build system of the package is specified
# We are using `pixi-build-python` in order to build a Python package
[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "0.1.*"
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
]

[tool.pixi.package.host-dependencies]
# hatchling = "*"
scikit-build-core = "*"
numpy = "*"
mkl-devel = "*"
nlopt = "*"

[tool.pixi.package.run-dependencies]
numpy = "*"
mkl-devel = "*"
nlopt = "*"


[tool.pixi.pypi-dependencies]
mckit = { path = ".", editable = true }

[tool.pixi.dependencies]
nlopt = ">=2.10.0,<3"
mkl-devel = ">=2024.2.2,<2025"
numpy = ">=2.3.3,<3"
# nlopt = ">=2.10.0,<3"
# mkl-devel = ">=2024.2.2,<2025"
# numpy = ">=2.3.2,<3"


[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"


[tool.pixi.environments]
default = { features = ["dev", "py313"], solve-group = "default" }
analyze = { features = ["analyze", "py313"], solve-group = "default" }
docs = { features = ["docs", "py313"], solve-group = "default" }
typeguard = { features = ["typeguard", "py313"], solve-group = "default" }
pypi = { features = ["pypi", "py313"], solve-group = "default" }
py312 = { features = ["test", "py312"] }
py313 = { features = ["test", "py313"], solve-group = "default" }


[tool.pixi.tasks]
fast-test = "pytest -m 'not slow'"
test = "pytest"
mypy = "mypy src"
pre-commit = "pre-commit run --show-diff-on-failure --color=always --all-files"
ruff = """
  ruff check --fix src tests
  ruff format src tests
"""
pylint = "pylint --recursive=y src tests"
pyright = "pyright src tests"


[tool.pixi.feature.typeguard.tasks]
typeguard = "pytest -vv --emoji --typeguard-packages=src"

[tool.pixi.feature.pypi.tasks]
pypi_build = "uv build --no-build-isolation"
repairwheel = "repairwheel -l .pixi/envs/default/lib -o fixed-wheels dist/*.whl"

[tool.pixi.feature.dev.target.linux-64.dependencies]
gdb = ">=16.3,<17"
