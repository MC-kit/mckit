[build-system]
build-backend = "scikit_build_core.build"
requires = [ "numpy", "scikit-build-core>=0.12" ]

[project]
name = "mckit"
version = "0.9.2"
description = "Tools to process MCNP models and results"
readme = "README.rst"
keywords = [ "mckit", "MCNP" ]
license = "MIT"
# TODO @dvp: if python 3.14 is allowed, then pixi uses its freethreaded version, mckit (or numpy?) is not ready for that
#            implement testing environment and code changes for 3.14+-freethreaded
requires-python = ">=3.12,<3.14"
dependencies = [
  "click",
  "loguru",
  "numpy>=2.4",
  "ply",
  "sly",
  "tomli-w",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
[[project.authors]]
name = "rrn"
[[project.maintainers]]
email = "dmitri_portnov@yahoo.com"
name = "dvp2015"
[project.scripts]
mckit = "mckit.cli.runner:mckit"
[project.urls]
Documentation = "https://mckit.readthedocs.io"
Homepage = "https://github.com/MC-kit/mckit"
Issues = "https://github.com/MC-kit/mckit/issues"
Repository = "https://github.com/MC-kit/mckit"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = ".sk-build/{wheel_tag}"
[tool.scikit-build.build]
verbose = true
[tool.scikit-build.cmake]
build-type = "Release"
source-dir = "."
[tool.scikit-build.logging]
level = "INFO"
[tool.scikit-build.wheel]
# Установка py-api активирует Stable ABI, если версия ниже текущей
# py-api = "cp312"  # scikit-build ignores this SABI request on building
# and builds cp314.cp314t geometry
# TODO: for freethreaded try cp314.cp314t
# py-api = "cp312.cp312t"  # tries to build cp312.abi3.abi3t,
# but fails on numpy internal structures in npy_2_compat.h,
# which are hidden when Py_LIMITED_API is set on
packages = [ "src/mckit" ]
exclude = [ "**/__pycache__", "**/*.pyc" ]

# Dependency groups for the uv package manager (PEP 735).
# They mirror the feature sets defined in pixi.toml.
[dependency-groups]
analyze = [
  "duckdb>=1.5.5,<2",
  "marimo>=0.23.13",
  "polars>=1.43.0,<2",
  "pyarrow>=25.0.0,<26",
  "sqlglot>=28.10.1,<29",
]
build = [
  "pysocks>=1.7.1,<2",
  "scikit-build-core>=0.12",
]
docs = [
  "esbonio>=2",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.10",
  "sphinx-click>=6.2.0",
]
style = [
  "basedpyright>=1.39.8",
  "mypy>=2.1.0",
  "pre-commit>=4.3",
  "pyrefly>=1.1.1",
  "pylint>=4.0.6,<5",
  "pyright>=1.1.406",
  "ruff>=0.15",
  "ty>=0.0.55",
]
test = [
  "psutil>=7.2.2",
  "pytest>=9.0.3",
  "pytest-benchmark>=5.2.3",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "xdoctest>=1.3.2",
]
typeguard = [ "typeguard>=4.5" ]

[tool.mypy]
files = "src/**/*.py"
exclude = """  (?x)(
  parser.py$  # mypy doesn't like parser code
| _tab.py$    # ...
| lexer.py$   # ...
  )
"""
# namespace_packages = true
follow_imports = "silent"
python_version = "3.14"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disable_error_code = [ "annotation-unchecked" ]
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
# strict = true  # TODO dvp: uncomment this to get strict control
show_error_context = true
pretty = true
error_summary = true
cache_dir = ".cache/mypy"
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = [ "tomllib" ]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.coverage.paths]
source = [ "src" ]
[tool.coverage.report]
exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if TYPE_CHECKING:",
  "if self.debug",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 90  # TODO dvp: increase limit to 100 with code maturing
ignore_errors = true
omit = [ "**/__init__.py", "**/types.py", "*_tab.py" ]
show_missing = true
skip_covered = true
sort = "Cover"
[tool.coverage.run]
branch = true
omit = [ "**/__init__.py", "*_tab.py", "tools/*.py" ]
parallel = true
source = [ "src" ]

[tool.marimo.runtime]
pythonpath = [ "notebooks", "notebooks/common" ]

[tool.xdoctest]
options = ""
quiet = true

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
deps-file = "pyproject.toml"
exclude-deps = [ "intel-cmplr-lib-ur", "python-dotenv", "tomli", "tqdm", "typer" ]
paths = [ "adhoc", "src" ]
sections = [ "project.dependencies" ]
venvs = [ ".pixi/envs/analyze", ".pixi/envs/default", ".pixi/envs/docs" ]

[tool.rstcheck]
ignore_messages = '(Unknown directive type "(todo.*|automodule)".$)'
report_level = "ERROR"
