[build-system]
build-backend = "scikit_build_core.build"
requires = ["numpy", "scikit-build-core>=0.12"]

[project]
name = "mckit"
version = "0.8.6"
description = "Tools to process MCNP models and results"
readme = "README.rst"
keywords = ["mckit", "MCNP"]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
# dependencies = [
#   "click>=8.3.3,<9",
#   "loguru>=0.7.3,<0.8",
#   "mkl-devel",
#   "numpy",
#   "ply>=3.11,<4",
#   "sly>=0.5,<0.6",
#   "tomli-w>=1.2,<2",
#   "tqdm>=4.67.3,<5",
# ]
dependencies = [
  "click>=8.3.3,<9",
  "loguru>=0.7.3,<0.8",
  "mkl-devel",
  "numpy",
  "ply>=3.11,<4",
  "sly>=0.5,<0.6",
  "tomli-w>=1.2,<2",
]
[[project.authors]]
name = "rrn"
[[project.maintainers]]
name = "dvp2015"
email = "dmitri_portnov@yahoo.com"
[project.scripts]
mckit = "mckit.cli.runner:mckit"
[project.urls]
Documentation = "https://mckit.readthedocs.io"
Homepage = "https://github.com/MC-kit/mckit"
Issues = "https://github.com/MC-kit/mckit/issues"
Repository = "https://github.com/MC-kit/mckit"

[dependency-groups]
dev = [{ include-group = "style" }, { include-group = "test" }]
test = [
  "pytest>=9",
  "pytest-benchmark>=5.2",
  "pytest-cov>=7.1",
  "pytest-durations>=1.6",
  "pytest-mock>=3.15",
  "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.3",
]
docs = [
  "esbonio>=2",
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.10",
  "sphinx-togglebutton>=0.4",
]
analyze = ["jupyterlab>=4.5", "jupytext>=1.19"]
lint = ["pylint", "pylint-per-file-ignores"]
mypy = ["mypy>=1.2", "pep8-naming>=0.12.1", "types-setuptools>=80.9.0.20250529"]
pre_commit = ["pre-commit>=4.3"]
pypi = ["mkl-devel", "numpy", "repairwheel>=0.3", "scikit-build-core"]
pyright = ["pyright>=1.1.406"]
ruff = ["ruff>=0.0.259"]
style = [
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pyright" },
  { include-group = "ruff" },
]
# environments not in dev
typeguard = ["typeguard>=4.5"]

# pixi example: https://github.com/prefix-dev/pixi/blob/main/examples/pybind11/pyproject.toml
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
[tool.scikit-build.build]
verbose = false
[tool.scikit-build.cmake]
# source-dir = "."
build-type = "Debug"
[tool.scikit-build.logging]
level = "INFO"
# [tool.scikit-build.wheel]
# packages = [ "mckit" ]

[tool.pixi.dependencies]
python = "*"
nlopt = ">=2.10.1,<3"
mkl-devel = ">=2025.3.1,<2026"
numpy = ">=2.4.3,<3"
[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { solve-group = "default" }
analyze = { features = ["analyze"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
typeguard = { features = ["typeguard"], solve-group = "default" }
pypi = { features = ["pypi"], solve-group = "default" }
py312 = { features = ["test", "py312"] }
py313 = { features = ["test", "py313"] }
py314 = { features = ["test", "py314"] }
[tool.pixi.feature]
dev.tasks.mypy = "mypy src"
dev.tasks.pre-commit = "pre-commit run --show-diff-on-failure --color=always --all-files"
dev.tasks.ruff = { cmd = [
  "ruff check --fix src tests",
  "&&",
  "ruff format src tests",
] }
dev.tasks.pylint = "pylint --recursive=y src tests"
dev.tasks.pyright = "pyright src tests"
test.tasks.fast-test = "pytest -m 'not slow'"
test.tasks.test = "pytest"
py312.dependencies.python = "3.12.*"
py313.dependencies.python = "3.13.*"
py314.dependencies.python = "3.14.*"
pypi.tasks.pypi_build = "uv build --no-build-isolation"
pypi.tasks.repairwheel = "repairwheel -l .pixi/envs/default/lib -o fixed-wheels dist/*.whl"
typeguard.tasks.typeguard = "pytest --typeguard-packages=src"
[tool.pixi.package]
name = "mckit"
version = "0.8.6"
host-dependencies.scikit-build-core = "*"
host-dependencies.numpy = "*"
host-dependencies.mkl-devel = "*"
host-dependencies.nlopt = "*"
[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
[tool.pixi.package.run-dependencies]
numpy = "*"
mkl-devel = "*"
nlopt = "*"
click = ">=8.3"
loguru = ">=0.7"
ply = ">=3.11"
sly = ">=0.5"
tomli-w = ">=1.2"

[tool.pixi.pypi-dependencies]
mckit = { path = ".", editable = true }

[tool.pixi.workspace]
channels = ["conda-forge"]
# channels = ["https://prefix.dev/conda-forge"] - 2026-05-06 - timeout
platforms = ["linux-64", "win-64"]
conda-pypi-map = {}                # fix: pixi failed to load conda-pypi map - timeout
requires-pixi = ">=0.67"
preview = ["pixi-build"]

[tool.mypy]
python_version = "3.13"
cache_dir = ".cache/mypy"
files = "src/**/*.py"
# strict = true     # TODO dvp: uncomment this to get strict control
follow_imports = "silent"
# namespace_packages = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
disable_error_code = ["annotation-unchecked"]
show_error_context = true
error_summary = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = """  (?x)(
  parser.py$  # mypy doesn't like parser code
| _tab.py$    # ...
| lexer.py$   # ...
  )
"""
pretty = true
[[tool.mypy.overrides]]
module = [
  "IPython.core.magic",
  "IPython.core.magic_arguments",
  "click",
  "click.testing",
  "cyclopts",
  "dask.*",
  "duckdb",
  "eliot",
  "eliot.*",
  "loguru",
  "mckit.*",                      # TODO (dvp, style): make everything typed including extension 'geometry',
  "msgspec",
  "multipledispatch",
  "nox",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pytest",
  "rich.*",
  "scipy.constants",
  "scipy.sparse",
  "tomli",
  "tomllib",
  "xdoctest",
]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["tomllib"]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.coverage]
[tool.coverage.paths]
source = ["src"]
[tool.coverage.report]
exclude_lines = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self.debug",
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 90 # TODO dvp: increase limit to 100 with code maturing
ignore_errors = true
omit = ["**/__init__.py", "*_tab.py"]
show_missing = true
skip_covered = true
sort = "Cover"
[tool.coverage.run]
branch = true
omit = ["**/__init__.py", "*_tab.py", "tools/*.py"]
parallel = true
source = ["src"]

[tool.xdoctest]
quiet = true
options = ""

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
paths = ["src", "adhoc"]
venvs = [".pixi/envs/default", ".pixi/envs/analyze", ".pixi/envs/docs"]
deps-file = "pyproject.toml"
sections = ["project.dependencies"]
exclude-deps = [
  "intel-cmplr-lib-ur",
  "mkl-devel",
  "python-dotenv",
  "tomli",
  "tqdm",
  "typer",
]

[tool.rstcheck]
report_level = "ERROR"
ignore_messages = '(Unknown directive type "(todo.*|automodule)".$)'
