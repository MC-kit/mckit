# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See:
#     https://pre-commit.com/                   and
#     https://github.com/pre-commit/pre-commit  for more information
#     https://pre-commit.com/hooks.html         for more hooks
default_language_version:
  python: python3.13

repos:

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        exclude: uv.lock
      - id: check-ast
        exclude: notebooks
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: notebooks
      - id: check-merge-conflict
        exclude: \.rst$
      - id: check-shebang-scripts-are-executable
        exclude: notebooks  # jupytext creates python scripts with shebangs but without permissions
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
        exclude: notebooks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: data|.ipynb$|^\.
      - id: name-tests-test
        exclude: common.py|help*.*py
        args:
          - --pytest-test-first
      - id: mixed-line-ending
      - id: pretty-format-json
        args: [--autofix, --no-ensure-ascii, --no-sort-keys]
        exclude: data|\.ipynb$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
        args: ["--verbose"]
      - id: check-readthedocs

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.21.2"
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/fredrikaverpil/creosote
    rev: v5.2.0
    hooks:
      - id: creosote

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.15
    hooks:
      - id: uv-lock 

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        exclude: ^notebooks|^extern
      - id: ruff-format
        exclude: ^notebooks|^extern|ipynb$


  # Check for common shell mistakes
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1"
    hooks:
      - id: shellcheck
        args: [ --external-sources ]
        stages: [ manual ]


  # CMake formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: "v0.6.13"
    hooks:
      - id: cmake-format
        additional_dependencies: [ pyyaml ]
        types: [ file ]
        files: (\.cmake|CMakeLists.txt)(.in)?$

  # Clang format the codebase automatically
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v22.1.5"
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
